<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students League Panchbibi — Profile Picture Maker</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f3f5f7;color:#17202a;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
  main{max-width:620px;margin:0 auto;padding:22px 16px 36px}
  h1{font-size:24px;text-align:center;margin:4px 0 8px}
  p{line-height:1.6;text-align:center;color:#536170}
  .panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px #15223812}
  label.upload{display:block;text-align:center;padding:13px;border:2px dashed #b8c3cf;border-radius:12px;cursor:pointer;font-weight:700}
  input[type=file]{display:none}
  .preview{width:min(100%,500px);margin:16px auto 8px;aspect-ratio:1;background:#e8edf2;border-radius:12px;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}
  .primary{background:#087443;color:white}.secondary{background:#e8edf2;color:#17202a}
  button:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:13px;margin:12px 0 0}
</style>
</head>
<body>
<main>
  <h1>প্রোফাইল পিকচার তৈরি করুন</h1>
  <p>আপনার ছবি আপলোড করুন, তারপর ফ্রেমসহ তৈরি ছবিটি PNG হিসেবে সেভ করুন।</p>
  <section class="panel">
    <label class="upload" for="photoInput">📷 প্রোফাইল ছবি আপলোড করুন</label>
    <input id="photoInput" type="file" accept="image/*">
    <div class="preview"><canvas id="canvas" width="500" height="500" aria-label="প্রোফাইল ছবির প্রিভিউ"></canvas></div>
    <div class="controls">
      <button class="secondary" id="resetBtn" type="button" disabled>ছবি রিসেট</button>
      <button class="primary" id="downloadBtn" type="button" disabled>PNG ডাউনলোড</button>
    </div>
    <p class="hint">পরামর্শ: মুখটি ছবির মাঝামাঝি রাখলে ভালো দেখাবে। ছবি আপনার ডিভাইসেই প্রসেস হবে; সার্ভারে আপলোড করা হয় না।</p>
  </section>
</main>
<script>
const input = document.getElementById('photoInput');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn = document.getElementById('resetBtn');
const frame = new Image();
let userPhoto = null;
frame.src = 'profile_frame.png';

function render() {
  ctx.clearRect(0, 0, 500, 500);
  // Draw uploaded photo inside the circular opening.
  if (userPhoto) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(250, 245, 221, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    const scale = Math.max(442 / userPhoto.width, 442 / userPhoto.height);
    const w = userPhoto.width * scale;
    const h = userPhoto.height * scale;
    ctx.drawImage(userPhoto, 250 - w / 2, 245 - h / 2, w, h);
    ctx.restore();
  }
  if (frame.complete && frame.naturalWidth) ctx.drawImage(frame, 0, 0, 500, 500);
}
frame.onload = render;

input.addEventListener('change', () => {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('অনুগ্রহ করে একটি ছবি নির্বাচন করুন।'); return; }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    userPhoto = img;
    render();
    downloadBtn.disabled = false;
    resetBtn.disabled = false;
    URL.revokeObjectURL(url);
  };
  img.onerror = () => { alert('ছবিটি খোলা যায়নি। অন্য ছবি চেষ্টা করুন।'); URL.revokeObjectURL(url); };
  img.src = url;
});

resetBtn.addEventListener('click', () => {
  userPhoto = null;
  input.value = '';
  render();
  downloadBtn.disabled = true;
  resetBtn.disabled = true;
});

downloadBtn.addEventListener('click', () => {
  if (!userPhoto) return;
  canvas.toBlob(blob => {
    if (!blob) { alert('ছবি তৈরি করা যায়নি। আবার চেষ্টা করুন।'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'students-league-panchbibi-profile.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }, 'image/png');
});
</script>
</body>
</html>
